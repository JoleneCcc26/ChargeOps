# Deployment compose file for the VM (Milestone 4).
#
# What changed from Milestone 3: the database container and both data volumes
# are gone. MySQL is a managed Cloud SQL instance on a private IP, uploaded
# files live in a Cloud Storage bucket, and the passwords are fetched from
# Secret Manager at start-up by the application itself.
#
# Everything written below is non-secret: host names, a bucket name, a project
# id. There is no .env file next to this one and none inside the containers.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Image tags and the database address are written out in full on purpose: with
# nothing to substitute, the deployment directory needs no .env file at all.
#
# Credentials reach the containers through the VM's own service account:
#   Secret Manager  -> roles/secretmanager.secretAccessor on each secret
#   Cloud Storage   -> roles/storage.objectAdmin on the bucket
# No key file is mounted, copied or baked in anywhere.
name: chargeops

x-app-environment: &app-environment
  # Cloud SQL, reachable only inside our VPC - the instance has no public IP.
  DB_HOST: 10.117.0.3          # Cloud SQL, private IP only
  DB_PORT: 3306
  DB_USER: chargeops
  DB_NAME: ev
  DB_SSL: "false"
  PORT: 4000
  # Object storage instead of a container volume.
  STORAGE_DRIVER: gcs
  STORAGE_BUCKET: chargeops-group13-uploads
  # Where the passwords come from. Names, not values.
  SECRETS_PROVIDER: gcp
  SECRETS_PROJECT: chargeops-group13
  CORS_ORIGIN: http://34.173.175.72
  TRUST_PROXY: "true"

services:
  # Creates the tables from the files in migrations/, records each one in
  # schema_migrations, and exits. Runs before the API every time; applying
  # nothing is the normal case.
  migrate:
    image: us-central1-docker.pkg.dev/chargeops-group13/chargeops/api:v3
    command: ["node", "--import", "./server/boot.js", "scripts/migrate.mjs"]
    environment: *app-environment
    restart: "no"

  api:
    image: us-central1-docker.pkg.dev/chargeops-group13/chargeops/api:v3
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: us-central1-docker.pkg.dev/chargeops-group13/chargeops/api:v3
    command: ["node", "--import", "./server/boot.js", "server/workers/supervisor.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Simulated charger fleet. Without it the deployment has no drivers, so the
  # fleet settles at zero sessions in use.
  traffic:
    image: us-central1-docker.pkg.dev/chargeops-group13/chargeops/api:v3
    command: ["node", "--import", "./server/boot.js", "scripts/live-traffic.mjs"]
    environment:
      <<: *app-environment
      DEMO_API_URL: http://api:4000
      DEMO_USERNAME: ops
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: us-central1-docker.pkg.dev/chargeops-group13/chargeops/web:v3
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
