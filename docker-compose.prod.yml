# Deployment compose file for the VM.
#
# The difference from docker-compose.yml is that nothing is built here: every
# service runs an image pulled from Artifact Registry. The container that ran on
# a laptop and the container that runs on the VM are the same artifact.
#
#   export REGISTRY=us-central1-docker.pkg.dev/chargeops-group13/chargeops
#   export TAG=v1
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets come from a .env file that sits next to this one on the VM and is
# never committed: DB_PASS, MYSQL_ROOT_PASSWORD, AUTH_TOKEN_SECRET,
# STORAGE_SIGNING_SECRET, PUBLIC_URL.
name: chargeops

x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: 3306
  DB_USER: chargeops
  DB_PASS: ${DB_PASS:?set DB_PASS in .env}
  DB_NAME: ev
  DB_SSL: "false"
  PORT: 4000
  STORAGE_BUCKET: chargeops-cloud
  STORAGE_DIR: /app/server/.storage
  STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?set STORAGE_SIGNING_SECRET in .env}
  AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
  AUTH_OPS_PASSWORD: ${AUTH_OPS_PASSWORD:-chargeops-demo}
  AUTH_TECH_PASSWORD: ${AUTH_TECH_PASSWORD:-chargeops-demo}
  AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD:-chargeops-demo}
  AUTH_FINANCE_PASSWORD: ${AUTH_FINANCE_PASSWORD:-chargeops-demo}
  AUTH_HOST_PASSWORD: ${AUTH_HOST_PASSWORD:-chargeops-demo}
  CORS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env}
  TRUST_PROXY: "true"

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ev
      MYSQL_USER: chargeops
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--event-scheduler=ON"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: ${REGISTRY}/api:${TAG}
    command: ["node", "scripts/setup-db.mjs"]
    environment:
      <<: *app-environment
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${REGISTRY}/api:${TAG}
    environment: *app-environment
    volumes:
      - object-storage:/app/server/.storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: ${REGISTRY}/api:${TAG}
    command: ["node", "server/workers/supervisor.js"]
    environment: *app-environment
    volumes:
      - object-storage:/app/server/.storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Simulated charger fleet. Without it the deployment has no drivers, so the
  # fleet settles at zero sessions in use.
  traffic:
    image: ${REGISTRY}/api:${TAG}
    command: ["node", "scripts/live-traffic.mjs"]
    environment:
      <<: *app-environment
      DEMO_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${REGISTRY}/web:${TAG}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  object-storage:
