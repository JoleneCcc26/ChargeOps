server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # nginx refuses request bodies over 1 MB unless told otherwise, which
    # rejected ordinary phone photos before they reached the API. The API's
    # own limit is 5 files of 15 MB each, so allow that and let it enforce it.
    client_max_body_size 80m;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

